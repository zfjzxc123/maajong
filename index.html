<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麻將戰績簿</title>
<meta name="description" content="記錄每場麻將的輸贏，自動算出勝場、勝率、累計輸贏排行與對戰勝率。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one narrow column under a felt-green table band; rank and brand marks are drawn as mahjong tiles (ivory face, green back). Red = win, green = loss, as on a Taiwanese scoreboard. */
:root {
  --bg: #edf2ee;
  --surface: #fbfcfa;
  --ink: #16261f;
  --muted: #586a61;
  --line: #d2dcd5;
  --felt: #0f5c46;
  --felt-ink: #f1f6f2;
  --felt-soft: #cfe3d9;
  --tile: #f7f5ec;
  --tile-ink: #1a2a22;
  --tile-back: #0a3f30;
  --win: #c0242c;
  --lose: #1b7450;
  --focus: #1d5fd1;
  --felt-deep: #073526;
  --gold: #f0c04a;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1813; --surface: #13241d; --ink: #e5eee8; --muted: #94a89d; --line: #274137;
    --felt: #14503e; --felt-ink: #eef5f0; --felt-soft: #a9cbbb;
    --tile: #ece9dc; --tile-ink: #17251e; --tile-back: #06281e;
    --win: #ff7272; --lose: #55d19d; --focus: #8ab4ff; --felt-deep: #071f18; --gold: #f0c04a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1813; --surface: #13241d; --ink: #e5eee8; --muted: #94a89d; --line: #274137;
  --felt: #14503e; --felt-ink: #eef5f0; --felt-soft: #a9cbbb;
  --tile: #ece9dc; --tile-ink: #17251e; --tile-back: #06281e;
  --win: #ff7272; --lose: #55d19d; --focus: #8ab4ff; --felt-deep: #071f18; --gold: #f0c04a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--win); }
.neg { color: var(--lose); }
.zero { color: var(--muted); }

.wrap { max-width: 760px; margin-inline: auto; padding-inline: 16px; }

/* ---- felt band ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--felt); color: var(--felt-ink); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: .06em; line-height: 1.2; }
.tile { display: inline-grid; place-items: center; flex: none; width: 26px; height: 32px; background: var(--tile); color: var(--tile-ink); border-radius: 4px; border-bottom: 4px solid var(--tile-back); font-family: var(--font-display); font-weight: 900; font-size: 15px; line-height: 1; }
.tile.red { color: #b81d26; }
.tile.big { width: 32px; height: 40px; font-size: 20px; border-bottom-width: 5px; }
.tile.blank { color: var(--muted); }
.btn-new { flex: none; background: var(--tile); color: var(--tile-ink); border: 0; border-bottom: 4px solid var(--tile-back); border-radius: 6px; padding: 7px 14px; font-weight: 700; }
.btn-new:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn-new[disabled] { opacity: .55; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1 1 0; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 4px 9px; color: var(--felt-soft); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--felt-ink); border-bottom-color: var(--tile); font-weight: 700; }

/* ---- page ---- */
main { display: flex; flex-direction: column; gap: 28px; padding-block: 18px 56px; }
.notice { border: 1px dashed var(--muted); border-radius: 6px; padding: 10px 12px; color: var(--ink); background: var(--surface); margin-top: 16px; }
.notice b { font-weight: 700; }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .04em; text-wrap: balance; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.empty { margin: 0; padding: 22px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 6px 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--felt); color: var(--felt-ink); font-weight: 700; }
.rule { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
select, input[type="text"], input[type="date"] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }

.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 9px 8px; text-align: left; white-space: nowrap; }
th { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .08em; border-bottom: 1px solid var(--line); }
tbody tr + tr td, tbody tr + tr th { border-top: 1px solid var(--line); }
.r { text-align: right; }
.board td:first-child, .board th:first-child { padding-left: 12px; width: 1%; }
.board td:last-child, .board th:last-child { padding-right: 12px; }
.board .name { font-weight: 700; white-space: normal; overflow-wrap: anywhere; }
.board .key { font-weight: 600; color: var(--ink); }
.board th.key { font-weight: 700; }
.board tr.idle td { color: var(--muted); }

/* ---- TOP 3: the three dragon tiles 中 發 白 on the felt ---- */
.podium { gap: 0; border-radius: 10px; padding: 14px 12px 0; color: var(--felt-ink); overflow: hidden;
  background:
    radial-gradient(circle at 14% 22%, rgba(255,255,255,.16) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 86% 16%, rgba(255,255,255,.14) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 72% 48%, rgba(255,255,255,.10) 0 1px, transparent 2px),
    radial-gradient(circle at 27% 56%, rgba(255,255,255,.10) 0 1px, transparent 2px),
    radial-gradient(ellipse 60% 55% at 50% 30%, color-mix(in srgb, var(--gold) 34%, transparent), transparent 70%),
    linear-gradient(var(--felt), var(--felt-deep)); }
.pod-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pod-head h2 { font-size: 20px; letter-spacing: .14em; }
.pod-head span { font-size: 12px; color: var(--felt-soft); letter-spacing: .08em; }
.pod-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; text-align: center; }
.pod.p1 { order: 2; } .pod.p2 { order: 1; } .pod.p3 { order: 3; }
.crown { width: 34px; height: 22px; fill: var(--gold); filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); margin-bottom: 2px; }
.dragon { position: relative; display: grid; place-items: center; width: 58px; height: 78px; margin-bottom: 18px; border-radius: 8px; background: linear-gradient(160deg, #fffef6, #efead7); font-family: var(--font-display); font-weight: 900; font-size: 38px; line-height: 1; box-shadow: 0 5px 0 #d8d2bb, 0 11px 0 #17805f, 0 12px 0 #0c5a42, 0 20px 16px rgba(0,0,0,.4); }
.p1 .dragon { width: 74px; height: 98px; font-size: 50px; border-radius: 10px; animation: bob 3.2s ease-in-out infinite; }
.p2 .dragon { transform: rotate(-5deg); } .p3 .dragon { transform: rotate(5deg); }
.dragon.zhong { color: #c4161f; } .dragon.fa { color: #0f7a4d; }
.dragon.bai::after { content: ""; position: absolute; inset: 9px; border: 4px solid #2955a6; border-radius: 4px; }
.dragon.none { background: none; box-shadow: none; border: 2px dashed var(--felt-soft); opacity: .5; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.pod-name { max-width: 100%; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p1 .pod-name { font-size: 19px; }
.pod-stat { font-size: 12px; color: var(--felt-soft); white-space: nowrap; }
.pod-total { font-family: var(--font-num); font-size: 13px; font-weight: 600; }
.pod-base { align-self: stretch; margin-top: 6px; display: grid; place-items: center; height: 34px; border-radius: 6px 6px 0 0; background: rgba(255,255,255,.12); border-top: 2px solid rgba(255,255,255,.35); font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.p1 .pod-base { height: 58px; font-size: 26px; background: color-mix(in srgb, var(--gold) 30%, transparent); border-top-color: var(--gold); }
.p2 .pod-base { height: 44px; }

/* ---- 誰最爛: last place gets a tile turned face down ---- */
.worst { flex-direction: row; align-items: center; gap: 16px; background: var(--surface); border: 1px dashed var(--muted); border-radius: 10px; padding: 12px 14px 14px 18px; }
.facedown { flex: none; width: 38px; height: 52px; border-radius: 6px; transform: rotate(-12deg);
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 2px, transparent 2px 8px), repeating-linear-gradient(-45deg, rgba(255,255,255,.14) 0 2px, transparent 2px 8px), linear-gradient(160deg, #1c8a66, #0c5a42);
  box-shadow: 0 4px 0 #d8d2bb, 0 9px 9px rgba(0,0,0,.28); }
.worst-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.worst h2 { font-size: 13px; font-family: var(--font-body); font-weight: 500; color: var(--muted); letter-spacing: .1em; }
.worst-name { font-family: var(--font-display); font-weight: 900; font-size: 20px; overflow-wrap: anywhere; line-height: 1.3; }
.worst-stat { font-size: 13px; color: var(--muted); }
.worst-tag { flex: none; font-family: var(--font-display); font-weight: 900; font-size: 15px; letter-spacing: .1em; color: var(--lose); border: 2px solid currentColor; border-radius: 6px; padding: 2px 8px; transform: rotate(6deg); }

.notice .link { margin-left: 6px; }
.share-acts { display: flex; flex-wrap: wrap; gap: 8px; }
#invite { width: 100%; font-size: 13px; }

.pairs { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.pairs li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; }
.pairs li + li { border-top: 1px solid var(--line); }
.pairs .who { min-width: 0; overflow-wrap: anywhere; }
.pairs .who b { font-weight: 700; }
.pairs .who small { display: block; color: var(--muted); font-size: 12px; }
.pairs .pct { font-size: 18px; font-weight: 600; }
.nemesis { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.nemesis li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.nemesis b { display: block; font-weight: 700; overflow-wrap: anywhere; }
.nemesis span { display: block; font-size: 13px; color: var(--muted); }

.day { display: flex; flex-direction: column; gap: 8px; }
.day h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .06em; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.seats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; }
.seats li { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.seats .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seats li:first-child .n { font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: flex-end; font-size: 13px; }
.link { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; color: var(--ink); font-size: 13px; }
.link.danger { color: var(--win); border-color: currentColor; }
.solid { background: var(--felt); color: var(--felt-ink); border: 0; border-radius: 6px; padding: 7px 16px; font-weight: 700; }
.solid[disabled] { opacity: .5; cursor: not-allowed; }

.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1 1 auto; }
.people { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.people li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 12px; }
.people li + li { border-top: 1px solid var(--line); }
.people .pn { flex: 1 1 120px; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.people .pc { color: var(--muted); font-size: 13px; }
.people input { flex: 1 1 120px; }

/* ---- game form ---- */
dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(520px, 100% - 24px); max-height: calc(100% - 24px); border-radius: 10px; }
dialog::backdrop { background: rgba(4, 16, 12, .6); }
.form { display: flex; flex-direction: column; gap: 16px; padding: 18px 16px; }
.form h2 { font-size: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field > label { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; }
.chip[aria-pressed="true"] { background: var(--felt); border-color: var(--felt); color: var(--felt-ink); font-weight: 700; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto 104px; align-items: center; gap: 8px; }
.srow .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow input { width: 100%; text-align: right; font-family: var(--font-num); }
.sign button { padding: 6px 11px; }
.sign button.w[aria-pressed="true"] { background: var(--win); color: var(--surface); }
.sign button.l[aria-pressed="true"] { background: var(--lose); color: var(--surface); }
.sum { margin: 0; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 30px; }
.sum.ok { color: var(--lose); font-weight: 700; }
.sum.bad { color: var(--win); font-weight: 700; }
.err { margin: 0; color: var(--win); font-size: 14px; }
.form-acts { display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 420px) {
  th, td { padding: 9px 6px; }
  .brand h1 { font-size: 19px; }
  .tabs button { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><span class="tile big red" aria-hidden="true">中</span><h1>麻將戰績簿</h1></div>
      <button type="button" class="btn-new" id="btn-new">＋ 記一場</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="頁面">
      <button type="button" role="tab" id="tab-rank" data-tab="rank">排行榜</button>
      <button type="button" role="tab" id="tab-versus" data-tab="versus">對戰</button>
      <button type="button" role="tab" id="tab-history" data-tab="history">紀錄</button>
      <button type="button" role="tab" id="tab-players" data-tab="players">玩家</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="notice" id="notice" hidden></div>
  <main id="view"><p class="empty">正在讀取戰績…</p></main>
</div>

<dialog id="dlg-game" aria-labelledby="g-title">
  <form class="form" id="g-form" novalidate>
    <h2 id="g-title">記一場</h2>
    <div class="field">
      <label for="g-date">日期</label>
      <input type="date" id="g-date">
    </div>
    <div class="field">
      <span id="g-pick-label">選 4 位玩家</span>
      <div class="chips" id="g-pick" role="group" aria-labelledby="g-pick-label"></div>
      <div class="addrow">
        <input type="text" id="g-newname" maxlength="20" placeholder="新玩家的名字" aria-label="新玩家的名字">
        <button type="button" class="link" id="g-addplayer">加入</button>
      </div>
    </div>
    <div class="field">
      <span>每人輸贏（選「贏」或「輸」，再填金額或分數）</span>
      <div class="rows" id="g-rows"></div>
      <p class="sum" id="g-sum"></p>
    </div>
    <p class="err" id="g-err" hidden></p>
    <div class="form-acts">
      <button type="button" class="link" id="g-cancel">取消</button>
      <button type="submit" class="solid" id="g-save">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-gate" aria-labelledby="k-title">
  <form class="form" id="k-form" novalidate>
    <h2 id="k-title">輸入牌咖密語</h2>
    <p class="hint">密語相同的人會看到同一份戰績。第一個使用的人自己取一組（至少 6 個字），再告訴牌友。</p>
    <div class="field">
      <label for="k-phrase">牌咖密語</label>
      <input type="text" id="k-phrase" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <p class="err" id="k-err" hidden></p>
    <div class="form-acts">
      <button type="button" class="link" id="k-cancel">取消</button>
      <button type="submit" class="solid">進入</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

<script>
/* ==== stats:start (pure functions) ==== */
function computeStats(players, games, rule) {
  var names = new Map(players.map(function (p) { return [p.id, p.name]; }));
  var rows = new Map();
  function row(id) {
    if (!rows.has(id)) rows.set(id, { id: id, name: names.has(id) ? names.get(id) : '已移除的玩家', games: 0, wins: 0, total: 0, rate: null });
    return rows.get(id);
  }
  players.forEach(function (p) { row(p.id); });
  var h2h = new Map();
  function cell(a, b) {
    var k = a + '|' + b;
    if (!h2h.has(k)) h2h.set(k, { a: a, b: b, n: 0, w: 0, l: 0, diff: 0 });
    return h2h.get(k);
  }
  games.forEach(function (g) {
    var seats = g.seats;
    var top = Math.max.apply(null, seats.map(function (s) { return s.s; }));
    var allEqual = seats.every(function (s) { return s.s === top; });
    seats.forEach(function (s) {
      var r = row(s.p);
      r.games += 1;
      r.total += s.s;
      var win = rule === 'first' ? (!allEqual && s.s === top) : s.s > 0;
      if (win) r.wins += 1;
      seats.forEach(function (o) {
        if (o.p === s.p) return;
        var c = cell(s.p, o.p);
        c.n += 1;
        c.diff += s.s - o.s;
        if (s.s > o.s) c.w += 1; else if (s.s < o.s) c.l += 1;
      });
    });
  });

    var vals = form.sel.map(amount);
    if (vals.some(function (v) { return v !== null && isNaN(v); })) { el.className = 'sum bad'; el.textContent = '金額只能填數字。'; return; }
    var blanks = vals.filter(function (v) { return v === null; }).length;
    var sum = vals.reduce(function (a, v) { return a + (v || 0); }, 0);
    if (blanks === 1) {
      var idx = vals.indexOf(null), need = -sum, who = state.players.find(function (x) { return x.id === form.sel[idx]; });
      el.innerHTML = '<button type="button" class="link" id="g-fill">自動填入 ' + esc(who ? who.name : '') + '：' + (need > 0 ? '贏 ' : need < 0 ? '輸 ' : '') + Math.abs(need).toLocaleString('en-US') + '</button>';
      return;
    }
    if (blanks > 1) { el.textContent = '四個人的輸贏加起來要等於 0。'; return; }
    if (Math.abs(sum) < 1e-9) { el.className = 'sum ok'; el.textContent = '四人加總為 0，可以儲存。'; }
    else { el.className = 'sum bad'; el.textContent = '四人加總是 ' + (sum > 0 ? '+' : '−') + Math.abs(sum).toLocaleString('en-US') + '，要等於 0 才能儲存。'; }
  }
  async function saveGame() {
    if (form.busy) return;
    var date = $('g-date').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return showErr('請選日期。');
    if (form.sel.length !== 4) return showErr('請選滿 4 位玩家。');
    var vals = form.sel.map(amount);
    if (vals.some(function (v) { return v === null || isNaN(v); })) return showErr('請填好 4 個人的輸贏。');
    var sum = vals.reduce(function (a, v) { return a + v; }, 0);
    if (Math.abs(sum) > 1e-9) return showErr('四人加總要等於 0，請再檢查一次。');
    var seats = form.sel.map(function (pid, i) { return { p: pid, s: vals[i] }; });
    var old = form.id ? state.games.find(function (g) { return g.id === form.id; }) : null;
    var ref = form.id ? state.db.collection('games').doc(form.id) : state.db.collection('games').doc();
    form.busy = true; $('g-save').disabled = true; showErr('');
    try {
      await ref.set({ date: date, seats: seats, createdAt: old && old.createdAt ? old.createdAt : Date.now(), updatedAt: Date.now() });
      closeForm();
      toast(form.id ? '已更新這場比賽' : '已記下這場比賽');
      if (!form.id) { state.tab = 'rank'; render(); }
    } catch (e) { showErr(failText(e)); }
    form.busy = false; $('g-save').disabled = false;
  }

  $('g-pick').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-pid]'); if (!b) return;
    var pid = b.dataset.pid, i = form.sel.indexOf(pid);
    if (i >= 0) form.sel.splice(i, 1);
    else if (form.sel.length >= 4) return showErr('一場只能 4 位玩家，要換人請先取消一位。');
    else form.sel.push(pid);
    showErr(''); drawPick(); drawRows();
  });
  $('g-rows').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-sign]'); if (!b) return;
    var rowEl = b.closest('.srow'), v = form.vals[rowEl.dataset.pid];
    v.neg = b.dataset.sign === 'neg';
    rowEl.querySelector('.w').setAttribute('aria-pressed', String(!v.neg));
    rowEl.querySelector('.l').setAttribute('aria-pressed', String(v.neg));
    drawSum();
  });
  $('g-rows').addEventListener('input', function (ev) {
    var rowEl = ev.target.closest('.srow'); if (!rowEl) return;
    var v = form.vals[rowEl.dataset.pid], t = ev.target.value;
    if (/^\s*[-−－]/.test(t)) { v.neg = true; t = t.replace(/^\s*[-−－]\s*/, ''); ev.target.value = t; rowEl.querySelector('.w').setAttribute('aria-pressed', 'false'); rowEl.querySelector('.l').setAttribute('aria-pressed', 'true'); }
    else if (/^\s*[+＋]/.test(t)) { v.neg = false; t = t.replace(/^\s*[+＋]\s*/, ''); ev.target.value = t; rowEl.querySelector('.w').setAttribute('aria-pressed', 'true'); rowEl.querySelector('.l').setAttribute('aria-pressed', 'false'); }
    v.txt = t; showErr(''); drawSum();
  });
  $('g-sum').addEventListener('click', function (ev) {
    if (!ev.target.closest('#g-fill')) return;
    var vals = form.sel.map(amount), idx = vals.indexOf(null);
    var need = -vals.reduce(function (a, v) { return a + (v || 0); }, 0);
    form.vals[form.sel[idx]] = { neg: need < 0, txt: String(Math.abs(need)) };
    drawRows();
  });
  async function formAddPlayer() {
    var inp = $('g-newname');
    try {
      var id = await addPlayer(inp.value);
      inp.value = ''; showErr('');
      if (form.sel.length < 4) form.sel.push(id);
      drawPick(); drawRows();
    } catch (e) { showErr(e.msg || '沒有存成功，請再試一次。'); }
  }
  $('g-addplayer').addEventListener('click', formAddPlayer);
  $('g-newname').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); formAddPlayer(); } });
  $('g-form').addEventListener('submit', function (ev) { ev.preventDefault(); saveGame(); });
  $('g-cancel').addEventListener('click', closeForm);
  $('btn-new').addEventListener('click', function () { openForm(null); });

  /* ---- page events ---- */
  function setTab(t, push) {
    if (TABS.indexOf(t) < 0) t = 'rank';
    state.tab = t; state.confirmGame = state.confirmPlayer = state.editPlayer = null;
    if (push) { try { history.replaceState(null, '', '#' + t); } catch (e) { /* hash is optional */ } }
    render();
  }
  document.querySelector('.tabs').addEventListener('click', function (ev) { var b = ev.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab, true); });
  window.addEventListener('hashchange', function () { var t = location.hash.slice(1); if (t.indexOf('k=') === 0) location.reload(); else setTab(t, false); });

  view.addEventListener('change', function (ev) {
    if (ev.target.id !== 'rule') return;
    state.rule = ev.target.value; render();
    if (writable() && !isExample()) state.db.doc('settings/main').set({ winRule: state.rule }).catch(function (e) { toast(failText(e)); });
  });
  view.addEventListener('input', function (ev) { if (ev.target.id === 'p-edit') state.editText = ev.target.value; });
  view.addEventListener('keydown', function (ev) {
    if (ev.target.id === 'p-edit' && ev.key === 'Enter') { ev.preventDefault(); act('rename-save', state.editPlayer); }
  });
  view.addEventListener('submit', async function (ev) {
    if (ev.target.id !== 'p-form') return;
    ev.preventDefault();
    var inp = $('p-new');
    try { await addPlayer(inp.value); toast('已新增玩家'); render(); }
    catch (e) { toast(e.msg || '沒有存成功，請再試一次。'); }
  });
  view.addEventListener('click', function (ev) { var b = ev.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset.id, b.dataset.key); });

  async function act(name, id, key) {
    if (name === 'sort') { state.sort = key; return render(); }
    if (name === 'del-cancel') { state.confirmGame = state.confirmPlayer = null; return render(); }
    if (name === 'rename-cancel') { state.editPlayer = null; return render(); }
    if (name === 'gate') return openGate();
    if (name === 'copy-invite') return copyInvite();
    if (!writable()) return;
    try {
      if (name === 'edit-game') { var g = state.games.find(function (x) { return x.id === id; }); if (g) openForm(g); }
      else if (name === 'del-game') { state.confirmGame = id; render(); }
      else if (name === 'del-game-yes') { state.confirmGame = null; await state.db.collection('games').doc(id).delete(); toast('已刪除這場比賽'); }
      else if (name === 'rename') { var p = state.players.find(function (x) { return x.id === id; }); state.editPlayer = id; state.editText = p ? p.name : ''; state.confirmPlayer = null; render(); }
      else if (name === 'rename-save') {
        var nm = cleanName(state.editText);
        if (!nm) return toast('名字不能空白。');
        if (nameTaken(nm, id)) return toast('已經有叫「' + nm + '」的玩家了。');
        state.editPlayer = null;
        await state.db.collection('players').doc(id).update({ name: nm });
        toast('已改名');
      }
      else if (name === 'del-player') { state.confirmPlayer = id; state.editPlayer = null; render(); }
      else if (name === 'del-player-yes') {
        state.confirmPlayer = null;
        if (state.games.some(function (x) { return x.seats.some(function (s) { return s.p === id; }); })) { render(); return toast('這位玩家有比賽紀錄，不能刪除。'); }
        await state.db.collection('players').doc(id).delete(); toast('已刪除玩家');
      }
    } catch (e) { toast(failText(e)); render(); }
  }

  /* ---- store ---- */
  function validGame(g) {
    return g && Array.isArray(g.seats) && g.seats.length >= 2 && g.seats.every(function (s) { return s && typeof s.p === 'string' && typeof s.s === 'number' && isFinite(s.s); });
  }
  var fs = null, unsubs = [];
  var KEY = 'mahjong-phrase';
  function invite() { return location.origin + location.pathname + '#k=' + encodeURIComponent(state.phrase); }
  function copyInvite() {
    var link = invite();
    var show = function () { var i = $('invite'); if (!i) return; i.hidden = false; i.value = link; i.focus(); i.select(); toast('請長按或全選後複製'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(function () { toast('已複製邀請連結'); }, show);
    else show();
  }
  async function roomId(phrase) {
    var bytes = new TextEncoder().encode('mahjong:' + phrase);
    var buf = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(buf)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  }
  function openGate() {
    var g = $('dlg-gate');
    $('k-phrase').value = state.phrase || '';
    $('k-err').hidden = true;
    $('k-cancel').hidden = !state.db;
    if (!g.open) { if (typeof g.showModal === 'function') g.showModal(); else g.setAttribute('open', ''); }
  }
  $('k-cancel').addEventListener('click', function () { $('dlg-gate').close(); });
  $('k-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var p = $('k-phrase').value.trim(), e = $('k-err');
    if (p.length < 6) { e.textContent = '密語至少要 6 個字，太短容易被別人猜到。'; e.hidden = false; return; }
    $('dlg-gate').close();
    await connect(p);
  });
  notice.addEventListener('click', function (ev) { if (ev.target.closest('[data-gate]')) openGate(); });

  async function connect(phrase) {
    unsubs.forEach(function (u) { u(); }); unsubs = [];
    state.players = []; state.games = []; state.gotPlayers = state.gotGames = false;
    state.rule = 'positive'; state.problem = null; state.db = null; state.phrase = phrase;
    try { localStorage.setItem(KEY, phrase); } catch (e) { /* remembered for this visit only */ }
    var root;
    try { root = fs.collection('rooms').doc(await roomId(phrase)); }
    catch (e) { state.problem = 'config'; state.why = '密語處理失敗（' + (e && e.message || e) + '）。'; return render(); }
    state.db = {
      collection: function (n) { return root.collection(n); },
      doc: function (p) { var a = p.split('/'); return root.collection(a[0]).doc(a[1]); }
    };
    render();
    var dead = function () { unsubs.forEach(function (u) { u(); }); unsubs = []; state.db = null; state.problem = 'rules'; closeForm(); render(); };
    unsubs.push(root.collection('players').limit(1000).onSnapshot(function (snap) {
      state.players = snap.docs.map(function (d) { var v = d.data() || {}; return { id: d.id, name: String(v.name || '未命名'), createdAt: v.createdAt || 0 }; });
      state.gotPlayers = true; render();
      if (dlg.open) drawPick();
    }, dead));
    unsubs.push(root.collection('games').limit(1000).onSnapshot(function (snap) {
      state.games = snap.docs.map(function (d) { var v = d.data() || {}; return { id: d.id, date: v.date, seats: v.seats, createdAt: v.createdAt || 0 }; }).filter(validGame);
      state.gotGames = true; render();
    }, dead));
    unsubs.push(root.collection('settings').doc('main').onSnapshot(function (snap) {
      var v = snap.exists ? snap.data() : null;
      var r = v && v.winRule === 'first' ? 'first' : v ? 'positive' : state.rule;
      if (r !== state.rule) { state.rule = r; render(); }
    }, function () { /* keep the default rule */ }));
  }

  async function boot() {
    var hash = decodeURIComponent(location.hash.slice(1)), fromLink = '';
    if (hash.indexOf('k=') === 0) { fromLink = hash.slice(2).trim(); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* keep the hash */ } }
    else if (TABS.indexOf(hash) >= 0) state.tab = hash;
    render();
    var cfg = window.FIREBASE_CONFIG;
    var why = '';
    if (!cfg || typeof cfg.projectId !== 'string' || !cfg.projectId || cfg.projectId.indexOf('貼上') >= 0) why = 'index.html 裡的 Firebase 設定還沒填好。';
    else if (!window.firebase || typeof firebase.firestore !== 'function') why = 'Firebase 程式沒有載入，請檢查網路或關掉擋廣告的外掛後重新整理。';
    else if (!window.crypto || !crypto.subtle) why = '請用 https 開頭的網址開啟（GitHub Pages 的網址），不要直接點開電腦裡的檔案。';
    if (!why) { try { firebase.initializeApp(cfg); fs = firebase.firestore(); } catch (e) { why = 'Firebase 啟動失敗（' + (e && e.message || e) + '）。'; } }
    state.dbChecked = true;
    if (why) { state.problem = 'config'; state.why = why; return render(); }
    var saved = '';
    try { saved = localStorage.getItem(KEY) || ''; } catch (e) { /* no saved phrase */ }
    var phrase = fromLink || saved;
    if (phrase.length >= 6) await connect(phrase);
    else { render(); openGate(); }
  }
  boot();
})();
</script>
</body>
</html>
